name: Telegram Release

on:
  push:
    branches: [ dev, main ]   # triggers on dev or main
  workflow_dispatch:          # allows manual trigger

jobs:
  build_and_send:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------- Ruby & Bundler ----------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.0'
          bundler-cache: false   # handle bundler manually

      # ---------- Flutter ----------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      # ---------- KEYSTORE ----------
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=my-release-key.jks" >> android/key.properties

      # ---------- BUILD & DEPLOY ----------
      - name: Build & Send via Fastlane
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROJECT_NAME: "Hojaty"
        run: |
          cd android

          # Install exact Bundler version
          gem install bundler:4.0.2

          # Configure local bundle path and install gems
          bundle _4.0.2_ config set path 'vendor/bundle'
          bundle _4.0.2_ install

          # Run Fastlane lane based on branch
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "DEV branch → sending arm64-v8a APK"
            bundle _4.0.2_ exec fastlane android telegram_apk
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "MAIN branch → sending AAB"
            bundle _4.0.2_ exec fastlane android telegram_aab
          else
            echo "Branch ${GITHUB_REF_NAME} has no Fastlane lane configured"
          fi
