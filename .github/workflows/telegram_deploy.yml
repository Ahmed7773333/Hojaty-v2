name: Android Internal Testing

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      # ---------- Decode Keystore ----------
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=my-release-key.jks" >> android/key.properties

      # ---------- Setup Fastlane ----------
      - name: Install Fastlane
        run: |
          cd android
          gem install bundler:2.7.2
          bundle _2.7.2_ init
          bundle _2.7.2_ add fastlane
          bundle install

      # ---------- Run Internal Testing lane ----------
      - name: Build & Upload to Internal Testing
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }} # Base64 encoded JSON
          PACKAGE_NAME: "com.wolf.hojaty"
        run: |
          cd android
          echo "$PLAY_STORE_JSON_KEY" | base64 --decode > play_store_key.json
          bundle exec fastlane android internal_test
