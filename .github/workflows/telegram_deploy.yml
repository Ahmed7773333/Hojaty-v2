name: Android Internal Testing

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      release_status:
        description: 'Release status in Google Play'
        required: false
        default: 'completed'
        type: choice
        options:
          - completed
          - draft

jobs:
  build_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android # This helps bundler find your Gemfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate api_keys.json from GitHub Secrets
        env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
        run: |
          if [ -z "$GEMINI_KEYS" ]; then
            echo "🚨 Error: GEMINI_KEYS secret is empty or not set in GitHub Secrets!"
            exit 1
          fi
          jq -n --arg keys "$GEMINI_KEYS" '{"GEMINI_KEYS": $keys}' > api_keys.json

      - name: Decode Keystore & Play Store Key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks
          echo "${{ secrets.PLAY_STORE_JSON }}" | base64 --decode > android/play_store_key.json

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEY_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=my-release-key.jks
          EOF

      - name: Run Fastlane
        env:
          PLAY_STORE_JSON: "play_store_key.json" # Tell Fastlane where the file is
          PACKAGE_NAME: "com.wolfdev.hojaty"
          RELEASE_STATUS: ${{ github.event.inputs.release_status || 'draft' }}
        run: |
          cd android
          # Install fastlane only if not in Gemfile
          bundle install || (bundle init && bundle add fastlane && bundle install)
          bundle exec fastlane android internal_test
