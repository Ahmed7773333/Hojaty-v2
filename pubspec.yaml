name: hojaty
description: A new Flutter project, "Hojaty".
publish_to: 'none'

version: 1.1.10+34

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Uncomment for localization
    sdk: flutter
  intl: ^0.20.2

  # Core
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  get_it: ^7.6.4
  flutter_bloc: ^8.1.3
  dartz: ^0.10.1
  dio: ^5.3.3
  flutter_secure_storage: ^9.0.0
  recase: ^4.1.0 # Useful for utils
  adhan_dart: ^1.1.2
  geolocator: ^14.0.2
  prayers_times: ^0.0.6
  hive_flutter: ^1.1.0
  geocoding: ^4.0.0
  hijri_calendar: ^1.0.7+7
  video_player: ^2.8.1
  chewie: ^1.7.5
  just_audio: ^0.9.36
  audio_video_progress_bar: ^2.0.1
  path_provider: ^2.1.2
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#F2E5C7"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#F2E5C7"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/jsons/
    - assets/pages-hafs/

  fonts:
    - family: Noto Kufi Arabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Regular.ttf
        - asset: assets/fonts/NotoKufiArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-Bold.ttf
          weight: 700
    - family: Elgharib
      fonts:
        - asset: assets/fonts/Elgharib-A591.ttf
    - family: Hafs Smart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
