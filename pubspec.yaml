publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Uncomment for localization
    sdk: flutter
  intl: ^0.20.2

  # Core
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  get_it: ^7.6.4
  flutter_bloc: ^8.1.3
