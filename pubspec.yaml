name: hojaty
description: "A new Flutter project."

publish_to: 'none'
version: 1.2.38+58

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  dio: ^5.11.0
  intl: ^0.20.2
  flutter_secure_storage: ^11.0.0
  recase: ^4.1.0
  awesome_notifications: ^0.12.1
  firebase_messaging: ^16.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.17
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  sqflite: ^2.4.1
  path: ^1.9.1
  web_socket_channel: ^3.0.1
  speech_to_text: ^7.5.0
  package_info_plus: ^10.2.2
  in_app_review: ^2.0.12
  upgrader: ^13.8.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:

  uses-material-design: true
  generate: true

  shaders:
    - shaders/mushaf_night_mode.frag

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/data/
    - assets/audio/
    - assets/fonts/
    - assets/debug/
  fonts:
    - family: Hafs Smart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf  
      


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "#f7f6f0"
  adaptive_icon_foreground_inset: 10
  adaptive_icon_foreground: "assets/icons/logo.png"
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21